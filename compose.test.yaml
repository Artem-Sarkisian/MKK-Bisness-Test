services:
  postgres:
    ports:
      - '127.0.0.1:55432:5432'
  rabbitmq:
    ports:
      - '127.0.0.1:55672:5672'
  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+asyncpg://payments:${POSTGRES_PASSWORD}@postgres:5432/payments_test
      RABBITMQ_URL: amqp://payments:${RABBITMQ_PASSWORD}@rabbitmq:5672/payments_test
      TEST_DATABASE_URL: postgresql+asyncpg://payments:${POSTGRES_PASSWORD}@postgres:5432/payments_test
      TEST_RABBITMQ_URL: amqp://payments:${RABBITMQ_PASSWORD}@rabbitmq:5672/payments_test
      API_KEY: ${API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: [sh, -c, 'alembic upgrade head && pytest -q -p no:cacheprovider']
